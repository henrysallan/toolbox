<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #1e1e1e);
        --text-2: var(--figma-color-text-secondary, #757575);
        --border: var(--figma-color-border, #e6e6e6);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-hover: var(--figma-color-bg-brand-hover, #007be5);
        --on-brand: var(--figma-color-text-onbrand, #ffffff);
        --warn: var(--figma-color-text-warning, #b86200);
        --danger: var(--figma-color-text-danger, #dc3412);
        --ok: var(--figma-color-text-success, #14ae5c);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        font: 11px/1.45 Inter, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .frame {
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-2);
        margin-bottom: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .frame .size { color: var(--text-2); margin-left: 6px; }
      .frame.empty { color: var(--text-2); }
      .opt { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--text-2); }
      button {
        width: 100%;
        height: 32px;
        border-radius: 6px;
        font: inherit;
        font-weight: 500;
        cursor: default;
      }
      .primary { border: 0; background: var(--brand); color: var(--on-brand); }
      .primary:hover:not(:disabled) { background: var(--brand-hover); }
      .primary:disabled { opacity: 0.45; }
      .secondary {
        margin-top: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }
      .status { margin-top: 10px; min-height: 16px; color: var(--text-2); }
      .status.ok { color: var(--ok); }
      .status.warn { color: var(--warn); }
      .status.err { color: var(--danger); }
      .summary { margin-top: 8px; color: var(--text-2); }
      details { margin-top: 8px; }
      summary { color: var(--warn); cursor: default; }
      details ul { margin: 6px 0 0; padding-left: 16px; color: var(--text-2); }
      details li { margin-bottom: 3px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="frame" class="frame empty">Select a frame to copy</div>
    <label class="opt"><input type="checkbox" id="reference" /> Include Figma's render (for comparing)</label>
    <button id="primary" class="primary" disabled>Convert</button>
    <button id="download" class="secondary" hidden>Download JSON</button>
    <div id="summary" class="summary" hidden></div>
    <div id="status" class="status"></div>
    <details id="warnings" hidden>
      <summary id="warnings-title"></summary>
      <ul id="warnings-list"></ul>
    </details>
    <script>/*__UI_JS__*/</script>
  </body>
</html>
