# CI — the hard gates are typecheck + the offline check scripts (they guard
# the AI recipe trust boundary: builder whitelist, graph validator, edit ops,
# repair loops). Lint gates through a ratchet: pre-existing errors are
# baselined, only NEW errors fail (riskfix-plan 070826, "Order of attack" §2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: typecheck + the check scripts need no postinstall
      # binaries (electron, ffmpeg-static) — skipping them is faster and
      # keeps CI off arbitrary install scripts.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run check

  lint:
    runs-on: ubuntu-latest
    # BLOCKING, but ratcheted: fails only when a file gains lint errors
    # beyond the committed baseline (scripts/lint-baseline.json). The
    # pre-existing errors (React 19 hooks rules vs the ref-mirror pattern)
    # are grandfathered; fix some, then tighten with
    # `npm run lint:ratchet -- --update`. When the baseline hits zero,
    # switch this step to plain `npm run lint`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:ratchet
